name: YAML Diff on PR

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - 'vocabulary.yml'

jobs:
  ## run the following on PRs
  yaml-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so both the base and head commits are available.
          # Head branches of PRs from forks do not exist in this repo, so
          # files are read by commit SHA rather than by branch name.
          fetch-depth: 0
          persist-credentials: false
      - name: Save base and head vocabulary.yml
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:vocabulary.yml" > /tmp/base_vocabulary.yml
          git show "$HEAD_SHA:vocabulary.yml" > /tmp/vocabulary.yml
      - name: Diff base branch `vocabulary.yml` vs. PR branch `vocabulary.yml`
        id: diff
        uses: josephburnett/jd@e37eef06c8638ac7a223d21fe3ff14082c5c0700 # v2.5.0
        with:
          args: /tmp/base_vocabulary.yml /tmp/vocabulary.yml
      - name: Comment PR with diff
        if: steps.diff.outputs.output != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ## Diff between base and head `vocabulary.yml`

            ```diff
            ${{ steps.diff.outputs.output }}
            ```
