# Diffs vocabulary.yml on PRs. This runs with a read-only token, as PRs from
# forks get one anyway. The diff is saved as an artifact and posted as a PR
# comment by the yaml-diff-comment.yaml workflow.
name: YAML Diff on PR

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'vocabulary.yml'
      - '.github/workflows/yaml-diff.yaml'

jobs:
  ## run the following on PRs
  yaml-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so both the base and head commits are available.
          # Head branches of PRs from forks do not exist in this repo, so
          # files are read by commit SHA rather than by branch name.
          fetch-depth: 0
          persist-credentials: false
      - name: Save base and head vocabulary.yml
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Saved in the workspace, as the jd Docker action cannot see /tmp.
        run: |
          git show "$BASE_SHA:vocabulary.yml" > base_vocabulary.yml
          git show "$HEAD_SHA:vocabulary.yml" > head_vocabulary.yml
      - name: Diff base branch `vocabulary.yml` vs. PR branch `vocabulary.yml`
        id: diff
        uses: josephburnett/jd@e37eef06c8638ac7a223d21fe3ff14082c5c0700 # v2.5.0
        with:
          args: -yaml base_vocabulary.yml head_vocabulary.yml
      # jd exits 0 if equal, 1 if different, and 2 on error. The action itself
      # always succeeds, so check for errors here.
      - name: Check for jd errors
        if: steps.diff.outputs.exit_code != '0' && steps.diff.outputs.exit_code != '1'
        env:
          OUTPUT: ${{ steps.diff.outputs.output }}
        run: |
          echo "$OUTPUT"
          exit 1
      # An empty diff file means there are no differences.
      - name: Save diff for comment workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.diff.outputs.exit_code }}
          OUTPUT: ${{ steps.diff.outputs.output }}
        run: |
          mkdir yaml-diff
          echo "$PR_NUMBER" > yaml-diff/pr-number
          if [ "$EXIT_CODE" = 1 ]; then
            printf '%s\n' "$OUTPUT" > yaml-diff/diff
          else
            : > yaml-diff/diff
          fi
      - name: Upload diff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yaml-diff
          path: yaml-diff/
          if-no-files-found: error
          retention-days: 5
