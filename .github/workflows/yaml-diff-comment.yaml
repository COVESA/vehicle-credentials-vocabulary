# Posts the vocabulary.yml diff from the yaml-diff.yaml workflow as a PR
# comment. This is a separate workflow so that PRs from forks can be commented
# on without running the PR's code with a write token. Nothing from the PR is
# checked out or run here, and the downloaded artifact is treated as untrusted.
name: YAML Diff Comment

on:
  workflow_run:
    workflows: ["YAML Diff on PR"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download diff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yaml-diff
          path: ${{ runner.temp }}/yaml-diff
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare comment
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/yaml-diff"
          pr_number=$(cat "$dir/pr-number")
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $pr_number"
            exit 1
          fi
          # Only comment on the PR the diff was made for. A mismatch can also
          # mean the PR was updated since, and a newer run will comment.
          pr_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .head.sha)
          if [ "$pr_sha" != "$HEAD_SHA" ]; then
            echo "PR #$pr_number head is $pr_sha, not $HEAD_SHA. Skipping."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"
          : > "$dir/comment.md"
          # Delete any earlier diff comment if there are no differences.
          if [ ! -s "$dir/diff" ]; then
            echo "mode=delete" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=upsert" >> "$GITHUB_OUTPUT"
          # Keep under GitHub's 65536 character comment limit.
          max=60000
          head -c "$max" "$dir/diff" > "$dir/diff-truncated"
          # Truncation can drop the final newline, which the fence needs.
          if [ -n "$(tail -c 1 "$dir/diff-truncated")" ]; then
            echo >> "$dir/diff-truncated"
          fi
          # Use a code fence longer than any backtick run in the diff.
          fence='```'
          while grep -qF "$fence" "$dir/diff-truncated"; do
            fence="$fence\`"
          done
          {
            echo '## Diff between base and head `vocabulary.yml`'
            echo
            echo "${fence}diff"
            cat "$dir/diff-truncated"
            echo "$fence"
            if [ "$(stat -c %s "$dir/diff")" -gt "$max" ]; then
              echo
              echo "Diff truncated to $max bytes."
            fi
          } > "$dir/comment.md"
      - name: Comment PR with diff
        if: steps.prepare.outputs.mode != 'skip'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          pr-number: ${{ steps.prepare.outputs.pr-number }}
          file-path: ${{ runner.temp }}/yaml-diff/comment.md
          comment-tag: yaml-diff
          mode: ${{ steps.prepare.outputs.mode }}
