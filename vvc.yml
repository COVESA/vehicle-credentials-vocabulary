    comment: The fees paid as a part of the registration, titling, or transaction identified by the document.

  - id: isInsured
    label: Is Insured
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
    comment: A boolean indicating whether the vehicle in question is covered under an insurance policy.

  - id: numberOfCylinders
