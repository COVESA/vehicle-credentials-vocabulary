vocab:
  id: vvc
  value: https://w3id.org/vvc#

ontology:
- property: dc:title
  value: Verifiable Vehicle Credentials Vocabulary 1.0

class:
  - id: VehicleTitleCredential
    label: Vehicle Title Credential
    comment: A document that establishes ownership of a vehicle as recognized by the issuing authority. Such documents contain important information including the vehicle identification number (VIN), the owner's name, and any liens against the vehicle. It is used in various legal and financial transactions involving the vehicle.

  - id: VehicleTitle
    label: Vehicle Title
    comment: A Vehicle Title represents the legal document that establishes a person's or entity's ownership of a vehicle. This class includes information such as the title number, date of issue, and any relevant liens or encumbrances associated with the vehicle.
  
  - id: VehicleRegistrationCredential
    label: Vehicle Registration Credential
    comment: A document that verifies a vehicle's registration with a governmental authority. This credential includes details such as the vehicle identification number (VIN), registration number, the owner's information, and the registration's validity period. It serves as proof that the vehicle has been registered and is allowed to operate on public roads.

  - id: VehicleRegistration
    label: Vehicle Registration
    comment: A Vehicle Registration represents the official record of a vehicle's registration with a government authority. This class includes details such as the registration number, date of registration, and the name of the registered owner, as well as any pertinent registration status or expiration information.

  - id: VehicleInsuranceCredential
    label: Vehicle Insurance Credential
    comment: A document that provides evidence of insurance coverage for a vehicle. This credential includes information such as the insurance policy number, the name of the insurance provider, coverage details, and the effective dates of the policy.

  - id: VehicleInsuranceInformation
    label: Vehicle Insurance Information
    comment: Vehicle Insurance Information contains details regarding the insurance coverage for a vehicle, including policy numbers, insurance provider, and validity periods. This class ensures that relevant insurance data is linked with the vehicle for regulatory and risk management purposes.

  - id: schema:Person
    label: Person
    defined_by: https://schema.org/Person

  - id: schema:Organization
    label: Organization
    defined_by: https://schema.org/Organization

  - id: schema:Observation
    label: Observation
    defined_by: https://schema.org/Observation

  - id: schema:PostalAddress
    label: Postal Address
    defined_by: https://schema.org/PostalAddress

  - id: schema:Certification
    label: Certification
    defined_by: https://schema.org/Certification

  - id: schema:MonetaryAmount
    label: Monetary Amount
    defined_by: https://schema.org/MonetaryAmount

  - id: schema:QuantitativeValue
    label: QuantitativeValue
    defined_by: https://schema.org/QUantitativeValue

  - id: FirstSaleInformation
    label: First Sale Information
    comment: Information about the first sale of the vehicle.


property:
  - id: provenanceResource
    label: Provenance Resource
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
      - vvc:VehicleInsuranceInformation
    range: IRI
    comment: A reference to the source or origin of information regarding a vehicle's history, ownership, and other relevant details. This property may contain links to documents, records, or databases that provide verification of the vehicle's lineage and legal standing, ensuring transparency and trust in vehicle-related transactions.

  - id: owner
    label: Owner
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
      - vvc:VehicleInsuranceInformation
    range: IRI
    comment: The Owner property identifies the individual or organization that possesses legal rights to a vehicle. This property can be used to associate a vehicle with a person's name or an organization's entity, providing clear ownership information for registration and legal purposes.

  - id: licensePlateIdentifier
    label: License Plate Identifier
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
      - vvc:VehicleInsuranceInformation
    comment: The License Plate Identifier is a unique alphanumeric code assigned to a vehicle's license plate. This property is used to identify the vehicle on public roads and in legal documentation, aiding in tracking ownership, registration, and compliance with local regulations.

  - id: lienholder
    label: Lienholder
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
      - vvc:VehicleInsuranceInformation
    range: IRI
    comment: The Lienholder property identifies the individual or organization that has a legal claim or interest in a vehicle due to a loan or other financial obligation. This property is crucial for understanding any existing liens on the vehicle, which may affect ownership rights and transferability.

  - id: odometerReading
    label: Odometer Reading
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
      - vvc:VehicleInsuranceInformation
    range: IRI
    comment: The Odometer Reading represents the total distance traveled by a vehicle as recorded by the vehicle's odometer. This property is useful for assessing the vehicle's usage, maintenance needs, and overall value in relation to age and condition.

  - id: lienholderReleaseDate
    label: Lienholder Release Date
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
      - vvc:VehicleInsuranceInformation
    range: xsd:dateTime
    comment: The Odometer Reading represents the total distance traveled by a vehicle as recorded by the vehicle's odometer. This property is useful for assessing the vehicle's usage, maintenance needs, and overall value in relation to age and condition.
  
  - id: policyStartDate
    label: Policy Start Date
    domain:
      - vvc:VehicleInsuranceInformation
    range: xsd:dateTime
    comment: The Policy Start Date indicates the date when the insurance coverage begins.

  - id: policyEndDate
    label: Policy End Date
    domain:
      - vvc:VehicleInsuranceInformation
    range: xsd:dateTime
    comment: The Policy End Date indicates the date when the insurance coverage ends.

  - id: policyNumber
    label: Policy Number
    domain:
      - vvc:VehicleInsuranceInformation
    comment: The Policy Number property refers to the unique identifier assigned to an insurance policy covering a vehicle. This property is essential for managing insurance details, facilitating claims processing, and ensuring compliance with mandatory insurance requirements.

  - id: policyHolder
    label: Policy Holder
    domain:
      - vvc:VehicleInsuranceInformation
    comment: The Policy Holder is the person or organization that holds the policy in question.

  - id: coverageAmount
    label: Coverage Amount
    domain:
      - vvc:VehicleInsuranceInformation
    comment: The Coverage Amount property specifies the maximum sum that an insurance policy will pay in the event of a claim. This information is crucial for understanding the financial protection offered by the policy.

  - id: insuranceProvider
    label: Insurance Provider
    domain:
      - vvc:VehicleInsuranceInformation
    comment: The Insurance Provider property identifies the company or organization that issues the insurance policy for the vehicle. This property is essential for managing policy details, facilitating claims processing, and ensuring compliance with insurance requirements.

  - id: ownerSaleRequirements
    label: Owner Sale Requirements
    domain:
      - vvc:VehicleTitle
    comment: A detailed description of the conditions and requirements that a vehicle owner must fulfill to sell their vehicle. This may include documentation needed, compliance with legal regulations, and any restrictions or obligations associated with the sale, ensuring a lawful and smooth transfer of ownership.

  - id: titleIssueDate
    label: Title Issue Date
    domain:
      - vvc:VehicleTitle
    range:
      - xsd:dateTime
    comment: The date and time when the vehicle title was officially issued by the governing authority. This property records the moment the ownership of the vehicle was formally recognized and documented, serving as an important reference for ownership history and transactions.

  - id: designations
    label: Designations
    domain:
      - vvc:VehicleTitle
    comment: A collection of official titles or designations related to the vehicle's title status. This property may encompass various identifiers that indicate the vehicle's legal status, such as 'clear', 'salvage', or other relevant classifications that impact ownership, insurance, or transferability.

  - id: motorcycleEngineNumber
    label: Motorcycle Engine Number
    domain:
      - vvc:VehicleTitle
    comment: The Motorcycle Engine Number is a unique identifier assigned to the engine of a motorcycle. This property is essential for tracking engine specifications, verifying identity, and facilitating compliance with regulatory requirements regarding vehicle identification.

  - id: equipmentTrustNumber
    label: Equipment Trust Number
    domain:
      - vvc:VehicleTitle
    comment: The Motorcycle Engine Number is a unique identifier assigned to the engine of a motorcycle. This property is essential for tracking engine specifications, verifying identity, and facilitating compliance with regulatory requirements regarding vehicle identification.

  - id: registrationExpirationDate
    label: Registration Expiration Date
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
    range: xsd:dateTime
    comment: The Registration Expiration Date indicates the date on which the vehicle registration will become invalid unless renewed. This property is critical for ensuring compliance with registration requirements and avoiding penalties for operating an unregistered vehicle.

  - id: registrationStartDate
    label: Registration Start Date
    domain:
      - vvc:VehicleRegistration
    range: xsd:dateTime
    comment: The Registration Start Date indicates when the vehicle's registration became effective. This property is important for tracking the registration timeline and ensuring compliance with regulatory requirements.

  - id: controlNumber
    label: Control Number
    domain: vvc:VehicleTitle
    comment: The Control Number is a unique identifier assigned to a vehicle or related documentation for tracking and management purposes. This property helps in organizing records, facilitating audits, and ensuring that all vehicle credentials can be accurately referenced.

  - id: motivePower
    label: Motive Power
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
    comment: Motive Power indicates the propulsion mechanism of a vehicle.
  
  - id: purchaseDate
    label: Purchase Date
    domain:
      - vvc:VehicleTitle
      - vvc:VehicleRegistration
    range: xsd:dateTime
    comment: The Purchase Date specifies the date on which a vehicle was acquired by the owner. This property is important for tracking ownership history, determining warranty eligibility, and assessing vehicle depreciation over time.

  - id: registeringOrganization
    label: Registering Organization
    domain: vvc:VehicleRegistration
    comment: The Registering Organization property identifies the company or governmental entity responsible for the registration of the vehicle. This property is essential for verifying the legitimacy of the registration and for facilitating communication regarding registration matters.

  - id: class
    label: Class
    domain:
      - vvc:FirstSaleInformation
      - vvc:VehicleRegistration
    comment: Class

  - id: year
